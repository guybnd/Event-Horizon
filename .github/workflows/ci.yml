name: CI

# FLUX-941: PR/push gate for the EH repo itself (repo dev-hygiene, NOT a user-facing
# feature — never installed into user projects). Reuses the step set release.yml proves
# works. Lint (portal FLUX-583, engine FLUX-1073) is in the gate now that both
# workspace baselines are burned down to 0. typecheck + lint + check:boundary + engine
# tests are the gate.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel an in-flight run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Self-hosted (Guy's Linux box, 24c/128G) instead of ubuntu-latest: this private repo's
    # per-PR checks were burning paid hosted minutes, and the box runs the suite in a fraction
    # of the 2-core hosted time. The runner is a systemd service (actions.runner.*, installed
    # from ~/actions-runner-eh) — if this job sits queued forever, that machine is off or the
    # service is down. Additional platform runners (mac/win dev machines) can register with
    # their own labels later; release.yml stays on hosted macos/windows runners since those
    # builds need real Apple/MS images and only run once per release.
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The one real gate: dev runs via tsx/esbuild which strip types, so a type error
      # surfaces nowhere else.
      - name: Type-check (portal + engine)
        run: npm run typecheck

      # FLUX-583 (portal) / FLUX-1073 (engine): both lint baselines are burned down to 0.
      - name: Lint (portal + engine)
        run: npm run lint

      # FLUX-938: adapter-boundary guard — forbids per-CLI code outside engine/src/agents/.
      - name: Adapter-boundary guard
        run: npm run check:boundary

      # FLUX-1755: ambient-workspace guard — no NEW bare getWorkspace() calls (they resolve to the
      # default board when unbound; the allowlist only shrinks as modules migrate).
      - name: Workspace-binding guard
        run: npm run check:workspace-binding

      # FLUX-1665: test-tier classification guard — fails if a spawn/git-fixture test file is
      # missing from the committed integration tier (test-tiers.json), the list the local
      # `check` gate's unit/integration split and targeted `test:changed` gate depend on.
      - name: Test-tier classification guard
        run: npm run check:classify

      - name: Engine tests
        run: npm run test -w engine
